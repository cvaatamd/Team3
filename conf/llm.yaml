# Aitta (CSC LUMI LLM inference) defaults.
# Token is loaded from $AITTA_API_TOKEN at runtime (file path also accepted via $AITTA_API_TOKEN_FILE).
base_url: "https://aitta-api.csc.fi/openai/v1"
model: "LumiOpen/Llama-Poro-2-70B-Instruct"   # change to gpt-oss-120b, Qwen3-Coder-Next, etc.
temperature: 0.0
max_tokens: 1024

# Retry policy. Aitta returns 429 with a ~1-minute cooldown when rate-limited.
max_retries: 6
backoff_initial_s: 2.0
backoff_max_s: 90.0

# Cache LLM decisions to disk so re-running the planner is free.
decision_cache_dir: "results/llm_cache"
